<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsorship Registration - 3rd ENT CU Congress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { chula: { DEFAULT: '#D685A9', dark: '#b56d8e', light: '#fdf2f8' } }, fontFamily: { sans: ['Prompt', 'sans-serif'] } } } }
    </script>
    <script>
        // ----------------------------------------------------
        // เอา URL ของ Google Apps Script มาใส่ที่ตัวแปรนี้
        const SCRIPT_URL = 'YOUR_WEB_APP_URL';
        // ----------------------------------------------------

        // โหลดข้อมูลเช็คโควต้า Lunch Symposium ตั้งแต่เปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', () => {
            fetch(SCRIPT_URL + "?action=checkQuota")
                .then(res => res.json())
                .then(data => {
                    if (data.quotaFull) {
                        const lunchRadio = document.getElementById('sponsorship-lunch');
                        const lunchLabel = document.getElementById('label-lunch');
                        lunchRadio.disabled = true;
                        lunchLabel.classList.add('text-gray-400', 'line-through');
                        lunchLabel.innerText += ' (เต็มโควต้า 2 บริษัทแล้ว)';
                    }
                }).catch(e => console.log('Error checking quota'));
        });

        function switchTab(tabId) {
            document.getElementById('booking-tab').classList.add('hidden');
            document.getElementById('upload-tab').classList.add('hidden');
            document.getElementById('tab-btn-booking').classList.remove('border-chula', 'text-chula');
            document.getElementById('tab-btn-upload').classList.remove('border-chula', 'text-chula');
            
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('tab-btn-' + tabId.split('-')[0]).classList.add('border-chula', 'text-chula');
        }

        function toggleReceiptInput() {
            const isOther = document.getElementById('receipt-other').checked;
            const inputField = document.getElementById('custom-receipt-name');
            if (isOther) {
                inputField.classList.remove('hidden');
                inputField.required = true;
            } else {
                inputField.classList.add('hidden');
                inputField.required = false;
                inputField.value = '';
            }
        }

        function toggleBoothInput(id) {
            document.getElementById('booth-amount-20k').classList.add('hidden');
            document.getElementById('booth-amount-40k').classList.add('hidden');
            if(id === '20k') document.getElementById('booth-amount-20k').classList.remove('hidden');
            if(id === '40k') document.getElementById('booth-amount-40k').classList.remove('hidden');
        }

        async function submitBooking(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = 'กำลังประมวลผล...';
            btn.disabled = true;

            const formData = new FormData(event.target);
            const data = {
                action: 'book',
                prefix: formData.get('prefix'),
                name: formData.get('name'),
                position: formData.get('position'),
                company: formData.get('company'),
                taxId: formData.get('taxId'),
                address: formData.get('address'),
                phone: formData.get('phone'),
                email: formData.get('email'),
                receiptType: formData.get('receiptType'),
                receiptCompany: formData.get('customReceiptName'),
                sponsorship: formData.get('sponsorship'),
                boothAmount: formData.get('boothAmount20k') || formData.get('boothAmount40k') || ''
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                
                if (result.success) {
                    Swal.fire('สำเร็จ!', `บันทึกข้อมูลเรียบร้อย\nหมายเลขใบจองของคุณคือ: ${result.bookingNumber}\nระบบได้ส่ง PDF ยืนยันไปที่อีเมลของคุณแล้ว`, 'success');
                    event.target.reset();
                } else {
                    Swal.fire('ข้อผิดพลาด', result.message, 'error');
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            }
            btn.innerHTML = 'ยืนยันการแสดงความจำนง';
            btn.disabled = false;
        }

        async function submitUpload(event) {
            event.preventDefault();
            const btn = document.getElementById('upload-btn');
            btn.innerHTML = 'กำลังอัปโหลด...';
            btn.disabled = true;

            const file = document.getElementById('slipFile').files[0];
            const reader = new FileReader();
            
            reader.onload = async function() {
                const base64 = reader.result.split(',')[1];
                const data = {
                    action: 'uploadSlip',
                    bookingNumber: document.getElementById('bookingId').value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileBase64: base64
                };

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(data),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const result = await response.json();
                    
                    if (result.success) {
                        Swal.fire('สำเร็จ!', 'อัปโหลดสลิปเรียบร้อย ระบบได้ส่งอีเมลยืนยันให้ท่านแล้ว', 'success');
                        event.target.reset();
                    } else {
                        Swal.fire('ไม่สำเร็จ', result.message, 'error');
                    }
                } catch (error) {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                }
                btn.innerHTML = 'อัปโหลดสลิป';
                btn.disabled = false;
            };
            reader.readAsDataURL(file);
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-chula-dark mb-2">3rd ENT CU Congress</h1>
            <p class="text-lg text-gray-600">“Clinical practice Reimagined”</p>
        </div>

        <div class="flex border-b border-gray-200 mb-6">
            <button id="tab-btn-booking" onclick="switchTab('booking-tab')" class="flex-1 py-3 text-center font-medium border-b-2 border-chula text-chula transition">ฟอร์มจองสปอนเซอร์</button>
            <button id="tab-btn-upload" onclick="switchTab('upload-tab')" class="flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent hover:text-gray-700 transition">แจ้งหลักฐานการโอนเงิน</button>
        </div>

        <!-- แท็บฟอร์มจอง -->
        <div id="booking-tab" class="bg-white rounded-xl shadow-md p-6 md:p-8">
            <form onsubmit="submitBooking(event)">
                <h2 class="text-xl font-semibold mb-6 pb-2 border-b">ข้อมูลผู้จอง</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium mb-1">คำนำหน้า <span class="text-red-500">*</span></label>
                        <select name="prefix" required class="w-full border rounded-lg p-2.5 focus:ring-chula focus:border-chula">
                            <option value="">เลือก</option>
                            <option value="นาย">นาย</option>
                            <option value="นาง">นาง</option>
                            <option value="นางสาว">นางสาว</option>
                            <option value="นพ.">นพ.</option>
                            <option value="พญ.">พญ.</option>
                            <option value="">อื่นๆ</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1">ชื่อ-สกุล <span class="text-red-500">*</span></label>
                        <input type="text" name="name" required class="w-full border rounded-lg p-2.5 focus:ring-chula focus:border-chula">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium mb-1">ตำแหน่ง <span class="text-red-500">*</span></label>
                        <input type="text" name="position" required class="w-full border rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">บริษัท <span class="text-red-500">*</span></label>
                        <input type="text" name="company" required class="w-full border rounded-lg p-2.5">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1">เลขประจำตัวผู้เสียภาษีอากรของบริษัท <span class="text-red-500">*</span></label>
                        <input type="text" name="taxId" required class="w-full border rounded-lg p-2.5">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1">ที่อยู่บริษัท <span class="text-red-500">*</span></label>
                        <textarea name="address" required rows="2" class="w-full border rounded-lg p-2.5"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">โทรศัพท์ <span class="text-red-500">*</span></label>
                        <input type="tel" name="phone" required class="w-full border rounded-lg p-2.5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">E-mail <span class="text-red-500">*</span></label>
                        <input type="email" name="email" required class="w-full border rounded-lg p-2.5">
                    </div>
                </div>

                <h2 class="text-xl font-semibold mt-8 mb-4 pb-2 border-b">รายละเอียดการออกใบเสร็จ</h2>
                <div class="space-y-3 mb-8">
                    <label class="flex items-center space-x-3">
                        <input type="radio" name="receiptType" value="same" onclick="toggleReceiptInput()" checked class="w-4 h-4 text-chula focus:ring-chula">
                        <span>ออกใบเสร็จในนามบริษัทที่แจ้งข้างต้น</span>
                    </label>
                    <label class="flex items-center space-x-3">
                        <input type="radio" id="receipt-other" name="receiptType" value="other" onclick="toggleReceiptInput()" class="w-4 h-4 text-chula focus:ring-chula">
                        <span>ออกใบเสร็จในนามบริษัทอื่น (โปรดระบุ)</span>
                    </label>
                    <input type="text" id="custom-receipt-name" name="customReceiptName" placeholder="ระบุชื่อบริษัทที่ต้องการให้ออกใบเสร็จ..." class="w-full border rounded-lg p-2.5 hidden">
                </div>

                <h2 class="text-xl font-semibold mt-8 mb-4 pb-2 border-b">รูปแบบการสนับสนุน (เลือก 1 อย่าง) <span class="text-red-500">*</span></h2>
                <div class="space-y-4 mb-8">
                    <div class="p-4 border rounded-lg hover:bg-chula-light transition">
                        <label class="flex items-start space-x-3 cursor-pointer">
                            <input type="radio" name="sponsorship" value="20,000 บาท/booth" onclick="toggleBoothInput('20k')" required class="mt-1 w-4 h-4 text-chula focus:ring-chula">
                            <div class="flex-1">
                                <span class="font-medium text-gray-800">เงินสนับสนุน 20,000 บาท/booth (1.5m x 0.75m)</span>
                                <input type="number" id="booth-amount-20k" name="boothAmount20k" placeholder="ระบุจำนวนบูธ" class="mt-2 w-full md:w-1/3 border rounded p-2 hidden">
                            </div>
                        </label>
                    </div>

                    <div class="p-4 border rounded-lg hover:bg-chula-light transition">
                        <label class="flex items-start space-x-3 cursor-pointer">
                            <input type="radio" name="sponsorship" value="40,000 บาท/booth" onclick="toggleBoothInput('40k')" class="mt-1 w-4 h-4 text-chula focus:ring-chula">
                            <div class="flex-1">
                                <span class="font-medium text-gray-800">เงินสนับสนุน 40,000 บาท/booth (3m x 0.75m)</span>
                                <input type="number" id="booth-amount-40k" name="boothAmount40k" placeholder="ระบุจำนวนบูธ" class="mt-2 w-full md:w-1/3 border rounded p-2 hidden">
                            </div>
                        </label>
                    </div>

                    <div class="p-4 border rounded-lg hover:bg-chula-light transition">
                        <label class="flex items-start space-x-3 cursor-pointer">
                            <input type="radio" id="sponsorship-lunch" name="sponsorship" value="lunch symposium 200,000 บาท" onclick="toggleBoothInput('none')" class="mt-1 w-4 h-4 text-chula focus:ring-chula">
                            <div>
                                <span id="label-lunch" class="font-medium text-gray-800">เงินสนับสนุน lunch symposium 200,000 บาท</span>
                                <ul class="list-disc ml-5 mt-2 text-sm text-gray-600">
                                    <li>Booth ขนาด (3m x 0.75m) 1 booth</li>
                                    <li>Lecture 1 session from company</li>
                                    <li>แพทย์ลงทะเบียน lecture 25 ท่าน และ lecture + workshop 5 ท่าน</li>
                                </ul>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-8">
                    <p class="text-red-700 font-medium">หมายเหตุ: ขอให้ท่านแจ้งหลักฐานการโอนเงินภายใน 29 มกราคม 2570</p>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-chula text-white font-bold py-3 px-4 rounded-lg hover:bg-chula-dark transition shadow-lg">ยืนยันการแสดงความจำนง</button>
            </form>
        </div>

        <!-- แท็บแนบสลิป -->
        <div id="upload-tab" class="bg-white rounded-xl shadow-md p-6 md:p-8 hidden">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
                <p class="text-blue-800 font-medium">📌 เลขการจองอยู่ในอีเมล กรุณาตรวจสอบอีเมลทุกครั้ง ที่ท่านได้รับหลังจากการจอง</p>
            </div>
            
            <form onsubmit="submitUpload(event)">
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-1">เลขที่ใบจอง <span class="text-red-500">*</span></label>
                    <input type="text" id="bookingId" placeholder="เช่น 01, 02" required class="w-full border rounded-lg p-2.5 focus:ring-chula focus:border-chula">
                </div>
                
                <div class="mb-8">
                    <label class="block text-sm font-medium mb-1">แนบไฟล์สลิป (รูปภาพหรือ PDF) <span class="text-red-500">*</span></label>
                    <input type="file" id="slipFile" accept="image/*,.pdf" required class="w-full border rounded-lg p-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-chula-light file:text-chula-dark hover:file:bg-pink-100">
                </div>

                <button type="submit" id="upload-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition shadow-lg">อัปโหลดสลิป</button>
            </form>
        </div>

    </div>
</body>
</html>
